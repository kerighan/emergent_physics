<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Deux ondes proches et leurs battements</title>
  <desc id="desc">Deux cosinus de fréquences spatiales proches produisent une somme faite d'oscillations rapides contenues dans une enveloppe lente.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .axis { stroke: #aab2c0; stroke-width: 1.5; }
    .grid { stroke: #e7eaf0; stroke-width: 1; }
    .wave1 { fill: none; stroke: #2764c5; stroke-width: 3; }
    .wave2 { fill: none; stroke: #d34b45; stroke-width: 3; }
    .sum { fill: none; stroke: #202938; stroke-width: 3; }
    .env { fill: none; stroke: #26976f; stroke-width: 2.5; stroke-dasharray: 9 7; }
    .small { font-size: 16px; }
    .label { font-size: 19px; font-weight: 600; }
    .title { font-size: 25px; font-weight: 700; }
    .blue { fill: #2764c5; }
    .red { fill: #d34b45; }
    .green { fill: #26976f; }
  </style>
